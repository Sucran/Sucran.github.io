# .github/workflows/gh-pages.yml

name: GitHub Pages

on:
  push:
    branches:
      - release

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Debug - Show directory structure
        run: |
          echo "=== Directory structure ==="
          find . -type f -name "*.toml" -o -name "*.yaml" -o -name "*.yml" | head -20
          echo "=== Config files ==="
          ls -la config/_default/
          echo "=== Module files ==="
          cat go.mod
          cat go.sum

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"
          extended: true

      - name: Debug - Hugo version and modules
        run: |
          echo "=== Hugo version ==="
          hugo version
          echo "=== Hugo modules ==="
          hugo mod graph
          echo "=== Hugo config ==="
          hugo config

      - name: Debug - Test Hugo build with verbose output
        run: |
          echo "=== Testing Hugo build ==="
          hugo --verbose --debug --logLevel debug --minify 2>&1 | head -50

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/release' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
